<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro-Pulse 3D 手语系统 V18.0 (Collage Edition)</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Courier+Prime:wght@400;700&display=swap');
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0d0a08; font-family: 'Bebas Neue', 'Microsoft YaHei', sans-serif; }
        
        /* 深度背景抑制 - 将背景调得极暗，仅保留微弱的轮廓感 */
        #video-container { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 0; 
            filter: sepia(0.8) contrast(1.4) brightness(0.15) saturate(0.8) hue-rotate(-10deg); 
            pointer-events: none; 
            background: #000;
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        #noise-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 5; background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.08"/%3E%3C/svg%3E'); pointer-events: none; mix-blend-mode: screen; }

        canvas#canvas3d { position: absolute; top: 0; left: 0; z-index: 10; cursor: move; }
        
        /* --- 美式复古拼贴 (Collage) UI 样式 --- */
        #ui-layer { position: absolute; top: 50px; left: 40px; z-index: 100; pointer-events: none; }
        
        /* 1. 主面板：波点画纸与硬阴影 */
        .status-box { 
            background-color: #f4ecd8; /* 纸张底色 */
            background-image: radial-gradient(#d1c4b0 2px, transparent 2px); /* 波点纹理 */
            background-size: 10px 10px;
            border: 3px solid #2c1e16; 
            padding: 25px 30px; 
            border-radius: 0; 
            box-shadow: 10px 10px 0px #e74c3c; /* 漫画风错位硬阴影 */
            transform: rotate(-2deg); /* 随意拼贴的倾斜感 */
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        
        /* 顶部半透明遮蔽胶带 */
        .status-box::before {
            content: ''; position: absolute; top: -18px; left: 50%; transform: translateX(-50%) rotate(3deg);
            width: 140px; height: 35px; background: rgba(223, 214, 196, 0.95); border: 1px solid #bbaea0; z-index: 10;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        
        /* 模拟 Dymo 打字机标签纸 */
        .dymo-label {
            background: #2c1e16; color: #f4ecd8; display: inline-block; padding: 4px 10px; 
            font-family: 'Courier Prime', monospace; font-size: 12px; font-weight: bold; letter-spacing: 2px;
            transform: rotate(1deg) translateY(-8px); box-shadow: 3px 3px 0px #f1c40f; margin-bottom: 5px;
        }

        #gesture-label { 
            font-size: 58px; font-family: 'Bebas Neue', sans-serif; text-transform: uppercase; letter-spacing: 4px; 
            color: #e74c3c; -webkit-text-stroke: 1.5px #2c1e16; text-shadow: 4px 4px 0px #2c1e16; margin-top: 5px; line-height: 1;
        }
        
        /* 提示词贴纸框：强制单行显示 */
        .hint-container { 
            margin-top: 20px; display: flex; gap: 8px; flex-direction: row; flex-wrap: nowrap; /* 强制单行 */
            background: #fff; padding: 10px; border: 2px solid #2c1e16; box-shadow: inset 3px 3px 0px rgba(0,0,0,0.05);
            transform: rotate(1.5deg);
        }
        /* 独立印章小标 */
        .hint-tag { 
            font-size: 11px; padding: 5px 10px; border: 2px solid #2c1e16; color: #2c1e16; background: #e0d6c8; 
            font-weight: bold; font-family: 'Courier Prime', monospace; white-space: nowrap; box-shadow: 2px 2px 0px #2c1e16;
        }
        
        /* 2. 数据面板：复古图表风格 */
        #data-panel { 
            position: absolute; bottom: 45px; left: 45px; z-index: 100; width: 250px; 
            background-color: #f4ecd8; background-image: radial-gradient(rgba(44, 30, 22, 0.1) 1.5px, transparent 1.5px); background-size: 6px 6px;
            border: 3px solid #2c1e16; color: #2c1e16; padding: 18px; font-family: 'Courier Prime', monospace; 
            box-shadow: 8px 8px 0px #3498db; transform: rotate(1deg); pointer-events: none;
        }
        
        /* 侧边小胶带 */
        #data-panel::after {
            content: ''; position: absolute; bottom: 20px; right: -25px; transform: rotate(45deg); width: 50px; height: 20px; 
            background: rgba(223, 214, 196, 0.8); border: 1px solid #bbaea0; z-index: 10;
        }

        .data-header { font-size: 14px; font-weight: bold; margin-bottom: 12px; border-bottom: 3px double #2c1e16; padding-bottom: 8px; color: #e74c3c; display: flex; justify-content: space-between; text-transform: uppercase;}
        .data-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; border-bottom: 1px dashed #a68a76; padding-bottom: 4px; font-weight: bold;}
        .data-val { background: #2c1e16; color: #fff; padding: 0 6px; font-size: 11px; }
        #log-stream { font-size: 10px; height: 42px; overflow: hidden; margin-top: 15px; line-height: 1.4; color: #2c1e16; background: #fff; padding: 8px; border: 2px solid #2c1e16; box-shadow: inset 2px 2px 0px rgba(0,0,0,0.1); }

        .control-hint { position: fixed; bottom: 40px; right: 40px; z-index: 100; color: #2c1e16; font-family: 'Courier Prime', monospace; font-size: 12px; font-weight: bold; background: #f1c40f; padding: 8px 15px; border: 3px solid #2c1e16; box-shadow: 4px 4px 0px #2c1e16; transform: rotate(-2deg); }
        
        /* 加载界面 */
        #loading-screen { position: fixed; inset: 0; background: #f4ecd8; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; color: #2c1e16; font-family: 'Courier Prime', monospace; }
        .loader { width: 50px; height: 50px; border: 4px dashed #e74c3c; border-radius: 50%; animation: spin 2s linear infinite; margin-bottom: 25px; }
        
        .pulse-effect { transform: scale(1.05) rotate(-4deg) !important; box-shadow: 15px 15px 0px #f1c40f !important; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="noise-overlay"></div>

<div id="loading-screen">
    <div class="loader"></div>
    <div style="letter-spacing: 3px; font-size: 14px; font-weight: bold; background: #2c1e16; color: #f4ecd8; padding: 5px 15px;">CALIBRATING OPTICS...</div>
</div>

<div id="video-container">
    <video id="input_video" playsinline></video>
</div>

<div id="ui-layer">
    <div class="status-box" id="main-status-box">
        <div class="dymo-label">SYSTEM_STATE: DARK_SILHOUETTE_MODE</div>
        <div id="gesture-label">AWAITING INPUT</div>
        <div class="hint-container">
            <span class="hint-tag" id="tag-感谢">感谢 (THANKS)</span>
            <span class="hint-tag" id="tag-没事">没事 (OK)</span>
            <span class="hint-tag" id="tag-不行">不行 (NO)</span>
            <span class="hint-tag" id="tag-你好">你好 (HELLO)</span>
            <span class="hint-tag" id="tag-难受">难受 (SAD)</span>
            <span class="hint-tag" id="tag-我爱你">我爱你 (LOVE)</span>
        </div>
    </div>
</div>

<div id="data-panel">
    <div class="data-header">
        <span>KINETIC TELEMETRY</span>
        <span id="live-dot" style="color:#e74c3c;">● REC</span>
    </div>
    <div class="data-row"><span>OPTIC_BRIGHT</span><span class="data-val">0.08_SIL</span></div>
    <div class="data-row"><span>TAPE_FPS</span><span id="fps-val" class="data-val">--</span></div>
    <div class="data-row"><span>LAG_MS</span><span id="lat-val" class="data-val">--</span></div>
    <div id="log-stream">
        > Optical sensor adjusted...<br>
        > Silhouette tracking active...
    </div>
</div>

<div class="control-hint">DRAG TO ROTATE // VOID PARTICLE MATRIX</div>
<canvas id="canvas3d"></canvas>

<script>
    // --- 核心常量定义 ---
    const PARTICLE_COUNT = 15000;
    const SKELETON_POINTS = 21;
    const CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

    const COLOR_SCHEMES = {
        '感谢': '#3498db',
        '没事': '#2ecc71',
        '不行': '#e74c3c',
        '你好': '#f1c40f',
        '难受': '#9b59b6',
        '我爱你': '#ff4757',
        'IDLE': '#f39c12'
    };

    let scene, camera, renderer, points, group;
    let positions, colors, targetPositions, targetColors, particleSizes, targetSizes; 
    let skeletonMeshes = [], connectionLines = [];
    
    let currentMode = 'IDLE', lastGesture = 'IDLE';
    let gestureStartTime = 0; 
    let frameCount = 0;
    let lastFpsTime = performance.now();

    let isDragging = false, previousMouseX = 0, previousMouseY = 0;
    let rotationTargetX = 0, rotationTargetY = 0;

    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('canvas3d');
    const gestureLabel = document.getElementById('gesture-label');
    const statusBox = document.getElementById('main-status-box');
    const fpsVal = document.getElementById('fps-val');
    const latVal = document.getElementById('lat-val');

    const vertexShader = `
        attribute float size;
        attribute vec3 color;
        varying vec3 vColor;
        void main() {
            vColor = color;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = size * (450.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
        }
    `;

    const fragmentShader = `
        varying vec3 vColor;
        void main() {
            float dist = length(gl_PointCoord - vec2(0.5));
            if (dist > 0.5) discard;
            float alpha = smoothstep(0.5, 0.15, dist); 
            gl_FragColor = vec4(vColor, alpha * 0.9);
        }
    `;

    function initThree() {
        scene = new THREE.Scene();
        group = new THREE.Group();
        scene.add(group);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 45;

        renderer = new THREE.WebGLRenderer({ canvas: canvasElement, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const geometry = new THREE.BufferGeometry();
        positions = new Float32Array(PARTICLE_COUNT * 3);
        targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        colors = new Float32Array(PARTICLE_COUNT * 3);
        targetColors = new Float32Array(PARTICLE_COUNT * 3);
        particleSizes = new Float32Array(PARTICLE_COUNT);
        targetSizes = new Float32Array(PARTICLE_COUNT);

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const i3 = i * 3;
            positions[i3] = (Math.random() - 0.5) * 160;
            positions[i3+1] = (Math.random() - 0.5) * 160;
            positions[i3+2] = (Math.random() - 0.5) * 160;
            particleSizes[i] = 0.1;
            targetSizes[i] = 0.1;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));

        const material = new THREE.ShaderMaterial({
            vertexShader, fragmentShader, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
        });

        points = new THREE.Points(geometry, material);
        group.add(points);

        const sphereGeo = new THREE.SphereGeometry(0.4, 8, 8); 
        for (let i = 0; i < SKELETON_POINTS; i++) {
            const sphereMat = new THREE.MeshBasicMaterial({ color: 0xf39c12, transparent: true, opacity: 0.8 });
            const mesh = new THREE.Mesh(sphereGeo, sphereMat);
            mesh.visible = false;
            skeletonMeshes.push(mesh);
            group.add(mesh);
        }

        CONNECTIONS.forEach(() => {
            const lineMat = new THREE.LineBasicMaterial({ color: 0xf39c12, transparent: true, opacity: 0.6 });
            const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
            const line = new THREE.Line(lineGeo, lineMat);
            line.visible = false;
            connectionLines.push(line);
            group.add(line);
        });

        canvasElement.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', e => {
            if (isDragging) {
                rotationTargetY += (e.clientX - previousMouseX) * 0.005;
                rotationTargetX += (e.clientY - previousMouseY) * 0.005;
            }
            previousMouseX = e.clientX;
            previousMouseY = e.clientY;
        });
    }

    function getChineseTextPoints(char) {
        const rand = Math.random();
        let x = 0, y = 0;
        if (char === '没') {
            if (rand < 0.25) { x = -2.8 + Math.random() * 0.8; y = 4 - Math.random() * 8; } 
            else if (rand < 0.5) { x = Math.random() * 6; y = 4 + Math.random() * 0.8; } 
            else if (rand < 0.75) { x = 1.5 + Math.random() * 4.5; y = 1.5 - Math.random() * 2; } 
            else { x = 2 + Math.random() * 4; y = -1.5 - Math.random() * 4.5; }
            x += 12; y += 14; 
        } else {
            if (rand < 0.15) { x = (Math.random() - 0.5) * 7; y = 5; } 
            else if (rand < 0.4) { x = (Math.random() - 0.5) * 5; y = 2 - Math.random() * 3; } 
            else if (rand < 0.7) { x = (Math.random() - 0.5) * 9; y = -1.5; } 
            else { x = 0; y = 6 - Math.random() * 12; }
            x += 23; y += 14;
        }
        return { x, y };
    }

    function getThanksPoints() {
        const choice = Math.random();
        let x = 0, y = 0, z = 0, s = 0.28; 
        if (choice < 0.6) {
            const part = Math.random();
            const bodyOffsetY = -18; 
            const scaleFactor = 1.3;  
            if (part < 0.15) { 
                const ang = Math.random() * Math.PI * 2;
                const r = (2.2 + Math.random() * 0.3) * scaleFactor;
                x = Math.cos(ang) * r;
                y = bodyOffsetY + 10 * scaleFactor + Math.sin(ang) * r; 
                s = 0.42; 
            } else if (part < 0.5) { 
                x = (Math.random() - 0.5) * 1.5 * scaleFactor;
                y = bodyOffsetY + Math.random() * 11 * scaleFactor;
            } else if (part < 0.75) { 
                x = (Math.random() > 0.5 ? 3.5 : -3.5) * (Math.random()) * scaleFactor;
                y = bodyOffsetY + 7 * scaleFactor - Math.abs(x);
            } else { 
                x = (Math.random() > 0.5 ? 2.5 : -2.5) * (Math.random()) * scaleFactor;
                y = bodyOffsetY + -Math.abs(x) * 1.5;
            }
            z = (Math.random() - 0.5) * 2;
        } else {
            const letters = "THANKS";
            const lIdx = Math.floor(Math.random() * letters.length);
            const letter = letters[lIdx];
            const ox = (lIdx - 2.5) * 7.5; 
            const oy = 6; 
            const lp = Math.random();
            if (letter === 'T') {
                if(lp < 0.4) { x = ox + (Math.random()-0.5)*5; y = oy + 5; }
                else { x = ox; y = oy + 5 - Math.random()*10; }
            } else if (letter === 'H') {
                if(lp < 0.3) { x = ox - 2.5; y = oy + (Math.random()-0.5)*10; }
                else if(lp < 0.6) { x = ox + 2.5; y = oy + (Math.random()-0.5)*10; }
                else { x = ox + (Math.random()-0.5)*5; y = oy; }
            } else if (letter === 'A') {
                if(lp < 0.4) { x = ox - 2.5 + Math.random()*5; y = oy + 5 - (Math.abs(x-ox))*4.5; }
                else { x = ox + (Math.random()-0.5)*3.5; y = oy - 1.2; }
            } else if (letter === 'N') {
                if(lp < 0.3) { x = ox - 2.5; y = oy + (Math.random()-0.5)*10; }
                else if(lp < 0.6) { x = ox + 2.5; y = oy + (Math.random()-0.5)*10; }
                else { x = ox - 2.5 + Math.random()*5; y = oy + 2.5 - (x-(ox-2.5))*1.2; }
            } else if (letter === 'K') {
                if(lp < 0.3) { x = ox - 2.5; y = oy + (Math.random()-0.5)*10; }
                else { x = ox - 2.5 + Math.random()*5; y = oy + (Math.random()>0.5 ? (x-(ox-2.5))*2.5 : -(x-(ox-2.5))*2.5); }
            } else if (letter === 'S') {
                const a = Math.random() * Math.PI * 1.5;
                x = ox + Math.cos(a) * 3;
                y = oy + Math.sin(a) * 3 + (a > Math.PI ? -3 : 3);
            }
            s = 0.32; z = 2;
        }
        return { x, y, z, s, isBody: choice < 0.6 };
    }

    function getHelloTypographyPoints() {
        const letters = "HELLO";
        const lIdx = Math.floor(Math.random() * letters.length);
        const char = letters[lIdx];
        const ox = (lIdx - 2) * 9.5; 
        const oy = 0; 
        let x = 0, y = 0, z = 0, s = 0.38;
        const lp = Math.random();
        if (char === 'H') {
            if (lp < 0.35) { x = ox - 3; y = (Math.random() - 0.5) * 14; }
            else if (lp < 0.7) { x = ox + 3; y = (Math.random() - 0.5) * 14; }
            else { x = ox + (Math.random() - 0.5) * 6; y = 0; }
        } else if (char === 'E') {
            if (lp < 0.4) { x = ox - 3; y = (Math.random() - 0.5) * 14; }
            else if (lp < 0.6) { x = ox + (Math.random() - 0.5) * 6; y = 7; }
            else if (lp < 0.8) { x = ox + (Math.random() - 0.5) * 5; y = 0; }
            else { x = ox + (Math.random() - 0.5) * 6; y = -7; }
        } else if (char === 'L') {
            if (lp < 0.7) { x = ox - 3; y = (Math.random() - 0.5) * 14; }
            else { x = ox + (Math.random() - 0.5) * 6; y = -7; x = Math.max(ox-3, x); }
        } else if (char === 'O') {
            const angle = Math.random() * Math.PI * 2;
            x = ox + Math.cos(angle) * 4;
            y = Math.sin(angle) * 7.5;
        }
        z = (Math.random() - 0.5) * 3;
        return { x, y, z, s };
    }

    function updateTargets(type) {
        const baseColor = new THREE.Color(COLOR_SCHEMES[type] || COLOR_SCHEMES['IDLE']);
        gestureStartTime = performance.now() * 0.001;
        
        for(let i=0; i<PARTICLE_COUNT; i++) {
            const i3 = i * 3;
            let x, y, z, s;
            let finalColor = baseColor.clone();
            s = 0.1 + Math.random() * 0.08;

            if(type === '感谢') {
                const p = getThanksPoints();
                x = p.x; y = p.y; z = p.z; s = p.s;
                if (!p.isBody) finalColor.set('#fdf9e1'); 
            } else if(type === '没事') {
                const choice = Math.random();
                if (choice < 0.55) {
                    const angle = Math.random() * Math.PI * 2;
                    const rBase = 14; 
                    if (Math.random() > 0.15) {
                        const r = rBase + (Math.random() - 0.5) * 2.5;
                        x = Math.cos(angle) * r; y = Math.sin(angle) * r;
                        s = 0.3 + Math.random() * 0.3; 
                    } else {
                        if (Math.random() > 0.5) { x = -5.5 + (Math.random()-0.5)*5; y = 5; }
                        else { x = 5.5 + (Math.random()-0.5)*5; y = 5; }
                        s = 0.45;
                    }
                    z = (Math.random() - 0.5) * 4;
                } else if (choice < 0.92) {
                    const p = getChineseTextPoints(Math.random() > 0.5 ? '没' : '事');
                    x = p.x; y = p.y; z = 6; s = 0.28 + Math.random() * 0.25;
                    finalColor.set('#e8f5e9');
                } else {
                    x = (Math.random() - 0.5) * 140; y = (Math.random() - 0.5) * 140; z = -30;
                    s = 0.06; finalColor.multiplyScalar(0.4); 
                }
            } else if(type === '我爱你') {
                const t = Math.random() * Math.PI * 2;
                const rFill = 0.1 + Math.pow(Math.random(), 0.6) * 0.9; 
                x = 16 * Math.pow(Math.sin(t), 3) * 0.9 * rFill;
                y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 0.9 * rFill;
                z = (Math.random() - 0.5) * 4.5 * Math.sqrt(1.0 - Math.pow(rFill - 0.5, 2) * 4.0); 
                s = 0.15 + Math.random() * 0.25;
                finalColor.copy(new THREE.Color('#ff4757')).lerp(new THREE.Color('#ff6b81'), (1.0 - rFill));
                if (Math.random() > 0.96) { finalColor.set('#ffffff'); s *= 1.6; }
            } else if(type === '不行') {
                if(Math.random() < 0.88) { 
                    if(Math.random() < 0.5) { 
                        const seg = Math.random();
                        if(seg < 0.33) { x=-12; y=(Math.random()-0.5)*20; }
                        else if(seg < 0.66) { x=-3; y=(Math.random()-0.5)*20; }
                        else { x=-12+(Math.random()*9); y=10-(x+12)*2.22; }
                    } else { 
                        const a = Math.random()*Math.PI*2; const r = 8.5 + Math.random()*0.6;
                        x = 11 + Math.cos(a)*r; y = Math.sin(a)*r*1.4;
                    }
                    s = 0.35 + Math.random()*0.3; z = (Math.random()-0.5)*4;
                } else {
                    x=(Math.random()-0.5)*150; y=(Math.random()-0.5)*150; z=-40;
                    finalColor.multiplyScalar(0.2); 
                }
            } else if(type === '你好') {
                const p = getHelloTypographyPoints();
                x = p.x; y = p.y; z = p.z; s = p.s;
                if (Math.random() > 0.8) finalColor.set('#81ecec');
            } else if(type === '难受') {
                if (Math.random() < 0.75) {
                    x = (Math.random() - 0.5) * 120; y = (Math.random() - 0.5) * 120; z = (Math.random() - 0.5) * 45;
                    s = 0.12 + Math.random() * 0.5;
                    finalColor.multiplyScalar(0.7);
                } else {
                    const emotionRand = Math.random();
                    if (emotionRand < 0.4) { x = -7 + (Math.random() - 0.5) * 2; y = 5 - Math.random() * 12; z = 6; s = 0.35; finalColor.set('#dfe6e9'); }
                    else if (emotionRand < 0.8) { x = 7 + (Math.random() - 0.5) * 2; y = 5 - Math.random() * 12; z = 6; s = 0.35; finalColor.set('#dfe6e9'); }
                    else { x = (Math.random() - 0.5) * 9; y = -9 - Math.abs(x) * 0.4; z = 6; s = 0.38; finalColor.set('#6c5ce7'); }
                }
            } else { 
                const r = 22 + Math.random() * 10;
                const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
                const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
                x = r * Math.sin(phi) * Math.cos(theta); y = r * Math.sin(phi) * Math.sin(theta); z = r * Math.cos(phi);
                finalColor.set('#f39c12').lerp(new THREE.Color('#e67e22'), Math.random() * 0.5);
            }
            
            targetPositions[i3] = x; targetPositions[i3+1] = y; targetPositions[i3+2] = z;
            targetColors[i3] = finalColor.r; targetColors[i3+1] = finalColor.g; targetColors[i3+2] = finalColor.b;
            targetSizes[i] = s;
        }
    }

    function analyzeGesture(lm) {
        const d = (p1, p2) => Math.hypot(lm[p1].x - lm[p2].x, lm[p1].y - lm[p2].y);
        const isFingerOpen = (tip, pip, mcp) => d(tip, mcp) > d(pip, mcp);
        const thumbOpen = d(4, 2) > 0.12; 
        const indexOpen = isFingerOpen(8, 6, 5);
        const middleOpen = isFingerOpen(12, 10, 9);
        const ringOpen = isFingerOpen(16, 14, 13);
        const pinkyOpen = isFingerOpen(20, 18, 17);
        if (thumbOpen && indexOpen && pinkyOpen && !middleOpen && !ringOpen) return "我爱你";
        if (thumbOpen && indexOpen && middleOpen && !ringOpen && !pinkyOpen) return "没事";
        if (thumbOpen && !indexOpen && !middleOpen && !ringOpen && !pinkyOpen) return "感谢";
        if (pinkyOpen && !indexOpen && !middleOpen && !ringOpen && !thumbOpen) return "不行";
        if (thumbOpen && indexOpen && middleOpen && ringOpen && pinkyOpen) {
            if ([8, 12, 16, 20].every(tip => lm[tip].y < lm[0].y - 0.15)) return "你好";
        }
        if ([4,8,12,16,20].every(pt => d(pt, 9) < 0.18)) return "难受";
        return "IDLE";
    }

    function animate() {
        requestAnimationFrame(animate);
        const time = performance.now() * 0.001;
        frameCount++;
        if (performance.now() - lastFpsTime > 1000) {
            fpsVal.innerText = frameCount; frameCount = 0; lastFpsTime = performance.now();
        }

        group.rotation.y += (rotationTargetY - group.rotation.y) * 0.08;
        group.rotation.x += (rotationTargetX - group.rotation.x) * 0.08;

        const posAttr = points.geometry.attributes.position;
        const colAttr = points.geometry.attributes.color;
        const sizeAttr = points.geometry.attributes.size;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const i3 = i * 3;
            const lerpSpeed = 0.15;
            if (currentMode === '感谢') {
                const bowAngle = Math.sin(time * 4) * 0.5 + 0.5; 
                let tx = targetPositions[i3], ty = targetPositions[i3+1], tz = targetPositions[i3+2];
                if (ty < -2) { 
                    const pivotY = -14; 
                    if (ty > pivotY) { 
                        const angle = bowAngle * 0.8, relY = ty - pivotY; 
                        ty = relY * Math.cos(angle) - tz * Math.sin(angle) + pivotY;
                        tz = relY * Math.sin(angle) + tz * Math.cos(angle);
                    }
                } else ty += Math.sin(time * 2 + tx * 0.2) * 0.6;
                posAttr.array[i3] += (tx - posAttr.array[i3]) * lerpSpeed;
                posAttr.array[i3+1] += (ty - posAttr.array[i3+1]) * lerpSpeed;
                posAttr.array[i3+2] += (tz - posAttr.array[i3+2]) * lerpSpeed;
                const shine = 1.05 + Math.sin(time * 5 + i * 0.01) * 0.1; 
                colAttr.array[i3] += (targetColors[i3] * shine - colAttr.array[i3]) * 0.15;
                sizeAttr.array[i] = targetSizes[i] * (0.9 + shine * 0.1);
            } else if (currentMode === '我爱你') {
                const t = time * 4.5;
                const heartScale = 1.0 + 0.15 * Math.pow(Math.sin(t), 12); 
                posAttr.array[i3] += (targetPositions[i3] * heartScale - posAttr.array[i3]) * 0.2;
                posAttr.array[i3+1] += (targetPositions[i3+1] * heartScale - posAttr.array[i3+1]) * 0.2;
                posAttr.array[i3+2] += (targetPositions[i3+2] - posAttr.array[i3+2]) * 0.2;
                const flash = 0.9 + Math.pow(Math.sin(t), 8) * 0.5;
                colAttr.array[i3] += (targetColors[i3] * flash - colAttr.array[i3]) * 0.2;
                sizeAttr.array[i] = targetSizes[i] * (0.8 + flash * 0.3);
            } else {
                posAttr.array[i3] += (targetPositions[i3] - posAttr.array[i3]) * 0.1;
                posAttr.array[i3+1] += (targetPositions[i3+1] - posAttr.array[i3+1]) * 0.1;
                posAttr.array[i3+2] += (targetPositions[i3+2] - posAttr.array[i3+2]) * 0.1;
                sizeAttr.array[i] += (targetSizes[i] - sizeAttr.array[i]) * 0.15;
                colAttr.array[i3] += (targetColors[i3] - colAttr.array[i3]) * 0.15;
                colAttr.array[i3+1] += (targetColors[i3+1] - colAttr.array[i3+1]) * 0.15;
                colAttr.array[i3+2] += (targetColors[i3+2] - colAttr.array[i3+2]) * 0.15;
            }
        }
        posAttr.needsUpdate = true; colAttr.needsUpdate = true; sizeAttr.needsUpdate = true;
        renderer.render(scene, camera);
    }

    const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.75, minTrackingConfidence: 0.75 });
    
    hands.onResults(results => {
        document.getElementById('loading-screen').style.display = 'none';
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const lm = results.multiHandLandmarks[0];
            latVal.innerText = (Math.random() * 3 + 12).toFixed(0) + 'ms';
            const currentC = new THREE.Color(COLOR_SCHEMES[currentMode] || COLOR_SCHEMES['IDLE']);
            lm.forEach((point, i) => {
                const mesh = skeletonMeshes[i]; mesh.visible = true;
                mesh.position.set((0.5 - point.x) * 55, (0.5 - point.y) * 45, -point.z * 60);
                mesh.material.color.lerp(currentC, 0.2);
            });
            CONNECTIONS.forEach((pair, i) => {
                const line = connectionLines[i]; line.visible = true;
                line.geometry.setFromPoints([skeletonMeshes[pair[0]].position, skeletonMeshes[pair[1]].position]);
                line.material.color.lerp(currentC, 0.2);
            });
            const gesture = analyzeGesture(lm);
            if(gesture !== lastGesture) {
                lastGesture = gesture; currentMode = gesture;
                gestureLabel.innerText = gesture === 'IDLE' ? '扫描中...' : gesture;
                statusBox.style.borderColor = COLOR_SCHEMES[gesture];
                statusBox.classList.add('pulse-effect'); setTimeout(() => statusBox.classList.remove('pulse-effect'), 500);
                updateTargets(gesture);
            }
        } else {
            skeletonMeshes.forEach(m => m.visible = false); connectionLines.forEach(l => l.visible = false);
            if(currentMode !== 'IDLE') { 
                currentMode = 'IDLE'; gestureLabel.innerText = '等待输入'; 
                statusBox.style.borderColor = '#e74c3c'; updateTargets('IDLE'); 
            }
        }
    });

    const cameraHelper = new Camera(videoElement, {
        onFrame: async () => { await hands.send({image: videoElement}); },
        width: 1280, height: 720
    });

    window.onload = () => { initThree(); cameraHelper.start(); animate(); updateTargets('IDLE'); };
    window.onresize = () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
</script>
</body>
